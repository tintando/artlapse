[project]
name = "artlapse"
version = "0.1.0"
description = "Rebuild a painting timelapse from a stream recording"
readme = "README.md"
authors = [
    { name = "tintando", email = "gabriel.al.bust@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
artlapse = "artlapse.cli:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x>=14.2.0",
    "pycolmap-cuda12>=4.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CuPy and a CUDA device; skipped without them"]
