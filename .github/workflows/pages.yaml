# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: pages

# The browser version in web/, built and deployed to Cloudflare Pages when a
# push to main changes it. Pushes and manual runs only: there is no
# pull_request trigger, so a pull request from a fork never runs this workflow
# and never sees the Cloudflare token.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: a half-finished
# Pages deploy would leave the published site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Vite 8 needs Node 20.19 or newer.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # tsc, then vite build into web/dist. The site is served from the root
      # of its host, which the bundle's absolute /assets/ paths assume.
      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # Cloudflare Pages, project "artlapse". The job has no GitHub token
  # permissions at all: it downloads this run's artifact and hands it to
  # wrangler, nothing more. A manual run from another branch, or a run in a
  # fork, skips it rather than overwriting production.
  cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'tintando'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      # Wrangler 4 needs Node 22 or newer.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy site --project-name=artlapse --branch=main --commit-hash=${{ github.sha }}
